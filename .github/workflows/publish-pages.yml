name: Refresh news and publish dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * 0'
      timezone: Asia/Seoul
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh article data
        run: node refresh-news.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp dist/index.html dist/global-auto-news.html dist/global-auto-news-01.html dist/live-news.json _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
